name: Data Pipeline

on:
  schedule:
    # Source cadence: QUARTERLY — DFFH publishes the Rental Report each quarter,
    # roughly five months in arrears. Run quarterly, staggered (day 9, 04:23 UTC),
    # a month or two after each release. Quarterly is the proportional cadence.
    - cron: '23 4 9 2,5,8,11 *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['pipeline/**']

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # mapshaper pipelines must use `npm install`, not `npm ci` (no lockfile committed).
      - run: cd pipeline && npm install
      - run: node pipeline/collect.mjs
      - run: node pipeline/aggregate.mjs
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/
          git diff --cached --quiet || git commit -m "Update rental data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push || (git pull --rebase && git push)
